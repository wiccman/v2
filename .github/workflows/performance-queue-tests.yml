name: Performance queue checks

on:
  push:
    branches: [feature/crypto-leader-minute9-59-91-5c]
    paths:
      - performance_ranked_minute9.py
      - test_performance_ranked_minute9.py
      - .github/workflows/performance-queue-tests.yml
  pull_request:
    paths:
      - performance_ranked_minute9.py
      - test_performance_ranked_minute9.py
      - .github/workflows/performance-queue-tests.yml

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_offline_tests.py -q test_single_coin_minute9.py test_performance_ranked_minute9.py

  public-feed-read-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Public GET requests only; no broker credentials or orders
        run: |
          python -u - <<'PY'
          import json, time, requests
          from concurrent.futures import ThreadPoolExecutor
          from performance_ranked_minute9 import CoinbasePerformance, PRODUCTS, ranked_observations
          now = time.time()
          start = int(now // 900) * 900
          source = CoinbasePerformance()
          def one(series):
              try:
                  row = source._one(series, start)
                  print(json.dumps({'series':series, 'return_pct':str(row.return_pct),
                                    'tick_age_seconds':round(time.time()-row.observed_at,3)}), flush=True)
                  return row
              except Exception as error:
                  response = getattr(error, 'response', None)
                  print(json.dumps({'series':series,'error_type':type(error).__name__,
                                    'http_status':getattr(response,'status_code',None)}), flush=True)
                  return None
          with ThreadPoolExecutor(max_workers=5) as pool:
              rows = list(pool.map(one, PRODUCTS))
          ticker='KXBTC15M-26NOV071415-15'
          r=requests.get('https://external-api.kalshi.com/trade-api/v2/markets/'+ticker, timeout=8)
          if r.status_code==200:
              market=r.json()['market']
              print(json.dumps({'event':'public_market_time_check','ticker':ticker,
                                'open_time':market.get('open_time'),'close_time':market.get('close_time')}),flush=True)
          else:
              print(json.dumps({'event':'public_market_time_check','http_status':r.status_code}),flush=True)
          ranked = ranked_observations([r for r in rows if r is not None], tuple(PRODUCTS), start, time.time())
          print(json.dumps({'event':'complete_fresh_queue_validated', 'queue':[r.series for r in ranked]}),flush=True)
          PY
