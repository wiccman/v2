name: Minute-eight top-two checks

on:
  push:
    branches: [fix/minute8-top2-delayed-backup]
  pull_request:
    paths:
      - minute8_top2.py
      - test_minute8_top2.py
      - .github/workflows/minute8-top2-tests.yml

permissions:
  contents: read

jobs:
  policy-and-execution-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline policy and existing execution checks
        run: python tools/run_offline_tests.py -q test_single_coin_minute9.py test_minute9_queue.py test_performance_ranked_minute9.py test_cash_checked_minute9.py test_minute9_until_close.py test_minute8_top2.py
      - name: Explicit production cutoff with new policy
        env:
          M9_ENTRY_END_SECONDS: "900"
        run: python tools/run_offline_tests.py -q test_minute8_top2.py
