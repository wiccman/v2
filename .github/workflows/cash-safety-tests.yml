name: Minute-nine cash safety

on:
  push:
    branches: [fix/minute9-cash-preflight-rejections, fix/aggregate-cash-preflight]
  pull_request:
    paths:
      - cash_checked_minute9.py
      - kalshi.py
      - single_coin_minute9.py
      - minute8_top2.py
      - test_cash_checked_minute9.py
      - test_target_balance_allocation.py
      - test_minute8_top2.py
      - .github/workflows/cash-safety-tests.yml

permissions:
  contents: read

jobs:
  cash-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline cash checks, rejections, ranking, exits and fallback
        run: python tools/run_offline_tests.py -q test_single_coin_minute9.py test_minute9_queue.py test_performance_ranked_minute9.py test_cash_checked_minute9.py test_target_balance_allocation.py test_minute8_top2.py
